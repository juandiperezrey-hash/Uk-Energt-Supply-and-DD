name: Update UK Generation Mix (NESO)

on:
  schedule:
    # Runs daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest UK generation mix
        run: python scripts/fetch_uk_mix.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/uk_daily_mix.json data/uk_ytd_mix.json
          git diff --cached --quiet || git commit -m "chore: update UK generation mix ($(date -u +%Y-%m-%d))"
          git push
